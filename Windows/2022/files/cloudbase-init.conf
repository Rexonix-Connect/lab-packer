[DEFAULT]
# Deploy-time personalization targets the built-in Administrator account or
# the form's username; clone customization specs remain the alternative path
# (all services below report no data and the run idles). The stock user
# plugins (CreateUser/SetUserPassword/SetUserSSHPublicKeys) are intentionally
# absent: they set a generated random password whenever the metadata carries
# none, which would break the known-Administrator-password break-glass on
# every form deployment. The ovf-identity.ps1 local script applies username,
# password and public-keys deterministically instead - empty fields change
# nothing. username/groups below only serve as fallbacks for user-data
# plugins that read them.
username = Administrator
groups = Administrators
allow_reboots = true
# OvfService consumes the vSphere vApp property form from the ovf-env.xml ISO
# transport; NoCloud/ConfigDrive cover non-VMware platforms such as Proxmox
# (citype nocloud / configdrive2); VMwareGuestInfoService covers
# guestinfo.metadata/userdata injection.
metadata_services = cloudbaseinit.metadata.services.ovfservice.OvfService, cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService, cloudbaseinit.metadata.services.configdrive.ConfigDriveService, cloudbaseinit.metadata.services.vmwareguestinfoservice.VMwareGuestInfoService
plugins = cloudbaseinit.plugins.common.mtu.MTUPlugin, cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin, cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin, cloudbaseinit.plugins.common.userdata.UserDataPlugin
local_scripts_path = C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
