# NetBox Diode appliance vhost.
#
# The Diode ingress container does the real routing - gRPC to the ingester and
# reconciler, an auth_request subrequest against diode-auth - and listens on
# 127.0.0.1:8080. This vhost adds exactly what a container cannot: TLS on the
# network interface, an HTTP redirect, and the metrics allowlist. Deployment
# specific bits live in the three snippets, which diode-firstboot.py rewrites.

server {
    # HTTP/2 as a listen parameter rather than the standalone "http2 on;"
    # directive: that directive only exists from nginx 1.25.1, and Ubuntu
    # 24.04 - which the hardened base this image clones is built on - ships
    # nginx 1.24.0, where it is an unknown directive and fails nginx -t.
    #
    # It is not optional here the way it is on a web front end: Diode's
    # ingestion is gRPC, and gRPC is HTTP/2 only.
    listen [::]:443 ssl http2 ipv6only=off;

    include /etc/nginx/snippets/diode-server-name.conf;

    ssl_certificate     /etc/diode/tls/diode.crt;
    ssl_certificate_key /etc/diode/tls/diode.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:DiodeTLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Empty unless an operator-supplied certificate is installed: HSTS turns a
    # self-signed certificate warning into a page the browser will not let you
    # click through, which would lock you out of a freshly deployed appliance.
    include /etc/nginx/snippets/diode-hsts.conf;

    client_max_body_size 25m;

    access_log /var/log/nginx/diode-access.log;
    error_log  /var/log/nginx/diode-error.log;

    # Ingestion. This MUST be grpc_pass, not proxy_pass: an SDK or agent
    # talking to a proxy_pass location gets a connection that looks like it
    # works and then fails on the first frame. ^~ so the prefix wins over any
    # regex location added later.
    #
    # The upstream is the compose project's own nginx, which speaks h2c on
    # 127.0.0.1:8080 and does the auth_request and service routing.
    location ^~ /diode/diode.v1. {
        grpc_pass grpc://127.0.0.1:8080;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;

        # An ingest stream from a large discovery run is long-lived; the
        # default 60s read timeout cuts it off mid-flight.
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
    }

    # Host metrics from prometheus-node-exporter, which binds to loopback
    # only. Denied unless the deploy form set an allowlist.
    location = /node-metrics {
        include /etc/nginx/snippets/diode-metrics.conf;

        proxy_pass http://127.0.0.1:9100/metrics;
    }

    # The OAuth2 token endpoint and everything else the ingress serves, over
    # ordinary HTTP/1.1.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}

server {
    listen [::]:80 ipv6only=off;
    server_name _;
    return 301 https://$host$request_uri;
}
