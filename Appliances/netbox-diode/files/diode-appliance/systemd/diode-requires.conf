# Drop-in applied to diode.service and nginx.service.
#
# Nothing may start before the first-boot bootstrap has rendered
# /etc/diode/compose/.env, the OAuth2 client credentials and the TLS
# certificate: the stack would come up with empty passwords and nginx would
# fail on a missing certificate. A failed bootstrap therefore leaves the
# appliance visibly down rather than half configured. Once bootstrapping has
# completed the unit's condition is no longer met, systemd skips it, and this
# dependency is satisfied immediately.
#
# RequiresMountsFor covers the other half: the images and volumes live on the
# data disk. fstab marks the mount nofail, so a missing disk leaves the
# appliance up and visibly broken here rather than dropping the whole VM into
# emergency mode.
[Unit]
Requires=diode-bootstrap.service
After=diode-bootstrap.service
RequiresMountsFor=/srv/diode
