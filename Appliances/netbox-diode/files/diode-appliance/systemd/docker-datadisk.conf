# Drop-in applied to docker.service.
#
# Docker's data root is /srv/diode/docker: both the baked container images and
# every named volume, so the Diode PostgreSQL cluster and the Redis
# append-only file live there. Starting Docker before that filesystem is
# mounted would find an empty directory under the mount point and recreate
# empty volumes - a stack that looks healthy while holding nothing, which is
# the worst of the available failure modes.
[Unit]
RequiresMountsFor=/srv/diode
After=diode-datadisk.service
