# Drop-in applied to netbox.service and netbox-rq.service.
#
# Deliberately stops short of ProtectSystem=strict and ProtectHome=true:
# NetBox runs operator-supplied custom scripts and reports, and a filesystem
# namespace that tight breaks them in ways that only show up in production.
# MemoryDenyWriteExecute is likewise left off - it breaks CPython extensions.
[Service]
NoNewPrivileges=true
ProtectSystem=full
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
