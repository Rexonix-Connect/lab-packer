# Drop-in applied to postgresql@.service, which covers every cluster instance
# without hardcoding the PostgreSQL version in a path.
#
# The cluster's data directory lives on the data disk, so starting the database
# before that filesystem is mounted would either fail or, worse, find an empty
# directory underneath the mount point.
[Unit]
RequiresMountsFor=/srv/netbox
After=netbox-datadisk.service
