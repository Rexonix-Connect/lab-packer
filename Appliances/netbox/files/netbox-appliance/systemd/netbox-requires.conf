# Drop-in applied to netbox.service, netbox-rq.service and nginx.service.
#
# Nothing may listen before the first-boot bootstrap has written
# /etc/netbox/appliance.json and the TLS certificate: NetBox would refuse to
# start without a configuration and nginx would fail on a missing certificate.
# A failed bootstrap therefore leaves the appliance visibly down rather than
# half configured. Once bootstrapping has completed the unit's condition is no
# longer met, systemd skips it, and this dependency is satisfied immediately.
[Unit]
Requires=netbox-bootstrap.service
After=netbox-bootstrap.service
