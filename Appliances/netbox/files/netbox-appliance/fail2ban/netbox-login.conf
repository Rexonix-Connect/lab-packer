# Failed NetBox web logins.
#
# NetBox does not log rejected credentials itself, so nginx's access log is the
# signal: a POST to /login/ that returns 200 re-rendered the form with an
# error, while a successful login answers 302. GET /login/ also returns 200,
# hence the method in the pattern.
[Definition]
failregex = ^<HOST> -.*"POST /login/[^"]*" 200
ignoreregex =
