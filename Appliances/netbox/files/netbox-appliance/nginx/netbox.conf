# NetBox appliance vhost. Derived from NetBox's contrib/nginx.conf, with TLS
# policy, a metrics allowlist and an HTTP redirect added. Deployment-specific
# bits live in the three snippets, which netbox-firstboot.py rewrites.

server {
    # HTTP/2 is enabled as a listen parameter rather than with the standalone
    # "http2 on;" directive: that directive only exists from nginx 1.25.1, and
    # Ubuntu 24.04 - which the hardened base this image clones is built on -
    # ships nginx 1.24.0, where it is an unknown directive and fails nginx -t.
    # The listen parameter is deprecated in newer nginx but still accepted, so
    # this form keeps working if the base ever moves to a later release.
    listen [::]:443 ssl http2 ipv6only=off;

    include /etc/nginx/snippets/netbox-server-name.conf;

    ssl_certificate     /etc/netbox/tls/netbox.crt;
    ssl_certificate_key /etc/netbox/tls/netbox.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:NetBoxTLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Empty unless an operator-supplied certificate is installed: HSTS turns a
    # self-signed certificate warning into a page the browser will not let you
    # click through, which would lock you out of a freshly deployed appliance.
    include /etc/nginx/snippets/netbox-hsts.conf;

    client_max_body_size 25m;

    access_log /var/log/nginx/netbox-access.log;
    error_log  /var/log/nginx/netbox-error.log;

    location /static/ {
        alias /opt/netbox/netbox/static/;
    }

    # NetBox's own Prometheus endpoint. Served only when METRICS_ENABLED is on
    # and the caller is in the allowlist; the snippet is "deny all" by default.
    location /metrics {
        include /etc/nginx/snippets/netbox-metrics.conf;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Host metrics from prometheus-node-exporter, which binds to loopback only.
    location = /node-metrics {
        include /etc/nginx/snippets/netbox-metrics.conf;

        proxy_pass http://127.0.0.1:9100/metrics;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matches the gunicorn worker timeout, so a slow request surfaces as
        # NetBox's own error rather than a 504 from the proxy.
        proxy_read_timeout 120s;
    }
}

server {
    listen [::]:80 ipv6only=off;
    server_name _;
    return 301 https://$host$request_uri;
}
