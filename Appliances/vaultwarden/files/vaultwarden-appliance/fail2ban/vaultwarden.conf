# Failed Vaultwarden logins and two-factor codes, from the vaultwarden.service
# journal. The address is the client's: nginx passes it in X-Real-IP, which
# Vaultwarden trusts from loopback only (IP_HEADER_TRUSTED_PROXIES=local).
[Definition]
failregex = ^.*Username or password is incorrect\. Try again\. IP: <ADDR>\. Username:.*$
            ^.*Invalid TOTP code! Server time: .* IP: <ADDR>$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=vaultwarden.service
