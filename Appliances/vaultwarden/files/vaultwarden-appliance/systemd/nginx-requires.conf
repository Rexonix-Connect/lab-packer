# Drop-in applied to nginx.service.
#
# nginx cannot start before the bootstrap has written the certificate and the
# deploy-time snippets. Once the bootstrap has completed its condition is no
# longer met, systemd skips it, and this is satisfied immediately. nginx does
# not require vaultwarden.service: with Vaultwarden down it still answers, with
# a 502, which says more than a refused connection does.
[Unit]
Requires=vaultwarden-bootstrap.service
After=vaultwarden-bootstrap.service vaultwarden-reconcile.service
