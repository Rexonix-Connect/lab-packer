# Drop-in applied to postgresql@.service, covering every cluster instance
# without hardcoding the PostgreSQL version in a path.
#
# The cluster's data directory lives on the data disk. The mount point
# underneath is immutable (chattr +i), so without the disk PostgreSQL fails to
# start instead of initializing anything on the root filesystem; this makes it
# wait for the mount in the first place.
[Unit]
RequiresMountsFor=/srv/vaultwarden
After=vaultwarden-datadisk.service
