# Proxy settings shared by every location of the Vaultwarden vhost.
proxy_pass http://vaultwarden;
proxy_http_version 1.1;

# WebSocket notifications (/notifications/hub) upgrade on the main port; the
# map keeps ordinary requests on keepalive connections.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $vaultwarden_connection_upgrade;

proxy_set_header Host $host;
# Vaultwarden reads the client address from X-Real-IP (IP_HEADER) and trusts
# it only from local addresses - which nginx, on loopback, is. It drives the
# login and admin rate limits and the addresses fail2ban bans.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Long-lived WebSocket connections; Vaultwarden pings them.
proxy_read_timeout 1h;
proxy_send_timeout 1h;
# Stream large attachment uploads instead of spooling them to disk first.
proxy_request_buffering off;
