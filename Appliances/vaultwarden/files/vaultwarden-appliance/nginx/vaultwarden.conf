# Vaultwarden appliance vhost. Deployment-specific bits live in snippets that
# vaultwarden-firstboot.py rewrites; this file is static.

# Access log without query strings and without the Referer: a few Bitwarden
# endpoints carry tokens in the query (the WebSocket hub's access_token,
# attachment and Send download links), and a Referer can repeat them. $uri is
# the path only.
log_format vaultwarden_redacted '$remote_addr - [$time_local] '
                                '"$request_method $uri $server_protocol" '
                                '$status $body_bytes_sent $request_time '
                                '"$http_user_agent"';

map $http_upgrade $vaultwarden_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream vaultwarden {
    # Vaultwarden binds loopback only; see compose.yaml.
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    # The listen parameter rather than "http2 on;", which only exists from
    # nginx 1.25.1 - Ubuntu 24.04 ships 1.24.
    listen [::]:443 ssl http2 ipv6only=off;

    include /etc/nginx/snippets/vaultwarden-server-name.conf;
    server_tokens off;

    ssl_certificate     /etc/vaultwarden/tls/vaultwarden.crt;
    ssl_certificate_key /etc/vaultwarden/tls/vaultwarden.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:VaultwardenTLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Empty unless an operator-supplied certificate is installed.
    include /etc/nginx/snippets/vaultwarden-hsts.conf;

    # Bitwarden clients cap an attachment at 500 MB; the margin is the
    # multipart overhead. Vaultwarden itself sets CSP, X-Frame-Options,
    # X-Content-Type-Options, Referrer-Policy and Permissions-Policy on every
    # response, so they are not repeated here - a second copy of a CSP header
    # makes browsers enforce the intersection of both.
    client_max_body_size 525m;

    access_log /var/log/nginx/vaultwarden-access.log vaultwarden_redacted;
    # The error log cannot be redacted: nginx writes the request line into
    # upstream errors as it received it. It is root/adm readable only and
    # rotated with the rest of /var/log/nginx; see the README.
    error_log  /var/log/nginx/vaultwarden-error.log error;

    # The admin page: loopback plus vaultwarden.admin-allow, deny everyone
    # else - in front of, not instead of, the argon2id admin token.
    location ^~ /admin {
        include /etc/nginx/snippets/vaultwarden-admin.conf;
        include /etc/nginx/snippets/vaultwarden-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/vaultwarden-proxy.conf;
    }
}

server {
    listen [::]:80 ipv6only=off;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/vaultwarden-access.log vaultwarden_redacted;
    # Bitwarden clients never use plain HTTP; this only spares people typing
    # the bare name into a browser. It carries no credentials either way.
    return 301 https://$host$request_uri;
}
