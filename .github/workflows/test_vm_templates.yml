name: Test VM Templates

# The umbrella over the per-template test workflows. Each template has its own
# workflow under .github/workflows/test_<template>.yml and can be run on its
# own; this runs any combination of them from one place, and is what Rebuild All
# VM Templates calls.
#
# Adding a template means adding its workflow, one input here and one job below.

on:
  workflow_dispatch:
    inputs:
      test_ubuntu_22_04_server:
        description: Test the Ubuntu 22.04 server template
        type: boolean
        required: false
        default: true
      test_ubuntu_22_04_desktop:
        description: Test the Ubuntu 22.04 desktop template
        type: boolean
        required: false
        default: true
      test_ubuntu_24_04_server:
        description: Test the Ubuntu 24.04 server template
        type: boolean
        required: false
        default: true
      test_ubuntu_24_04_desktop:
        description: Test the Ubuntu 24.04 desktop template
        type: boolean
        required: false
        default: true
      test_ubuntu_24_04_server_hardened:
        description: Test the Ubuntu 24.04 server hardened template
        type: boolean
        required: false
        default: true
      test_netbox_appliance:
        description: Test the NetBox appliance template
        type: boolean
        required: false
        default: true
      test_windows_server_2019:
        description: Test the Windows Server 2019 template
        type: boolean
        required: false
        default: true
      test_windows_server_2022:
        description: Test the Windows Server 2022 template
        type: boolean
        required: false
        default: true
      keep_minutes:
        description: Minutes to keep each successful test VM running before deletion (0 deletes immediately)
        type: number
        required: false
        default: 0
      ip_timeout:
        description: How long to wait for VMware Tools to report an IP address (for example 15m)
        type: string
        required: false
        default: 15m
      netbox_http_check:
        description: Check that the NetBox appliance serves HTTPS (needs the runner to reach the VM network)
        type: boolean
        required: false
        default: true
      netbox_timeout_minutes:
        description: Minutes to wait for the NetBox appliance to finish its first-boot bootstrap
        type: number
        required: false
        default: 20
      collect_diagnostics:
        description: Seed a login on Linux guests, check they booted cleanly, and dump state on failure
        type: boolean
        required: false
        default: true
      destroy_on_failure:
        description: Delete the test VM even when the test fails (failures otherwise keep it for inspection)
        type: boolean
        required: false
        default: false

  # Callable from the Rebuild All VM Templates orchestrator. Every input
  # defaults the same way, so calling it with no inputs tests everything.
  workflow_call:
    inputs:
      test_ubuntu_22_04_server:
        description: Test the Ubuntu 22.04 server template
        type: boolean
        required: false
        default: true
      test_ubuntu_22_04_desktop:
        description: Test the Ubuntu 22.04 desktop template
        type: boolean
        required: false
        default: true
      test_ubuntu_24_04_server:
        description: Test the Ubuntu 24.04 server template
        type: boolean
        required: false
        default: true
      test_ubuntu_24_04_desktop:
        description: Test the Ubuntu 24.04 desktop template
        type: boolean
        required: false
        default: true
      test_ubuntu_24_04_server_hardened:
        description: Test the Ubuntu 24.04 server hardened template
        type: boolean
        required: false
        default: true
      test_netbox_appliance:
        description: Test the NetBox appliance template
        type: boolean
        required: false
        default: true
      test_windows_server_2019:
        description: Test the Windows Server 2019 template
        type: boolean
        required: false
        default: true
      test_windows_server_2022:
        description: Test the Windows Server 2022 template
        type: boolean
        required: false
        default: true
      keep_minutes:
        description: Minutes to keep each successful test VM running before deletion (0 deletes immediately)
        type: number
        required: false
        default: 0
      ip_timeout:
        description: How long to wait for VMware Tools to report an IP address (for example 15m)
        type: string
        required: false
        default: 15m
      netbox_http_check:
        description: Check that the NetBox appliance serves HTTPS (needs the runner to reach the VM network)
        type: boolean
        required: false
        default: true
      netbox_timeout_minutes:
        description: Minutes to wait for the NetBox appliance to finish its first-boot bootstrap
        type: number
        required: false
        default: 20
      collect_diagnostics:
        description: Seed a login on Linux guests, check they booted cleanly, and dump state on failure
        type: boolean
        required: false
        default: true
      destroy_on_failure:
        description: Delete the test VM even when the test fails (failures otherwise keep it for inspection)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # Unticking every template must fail the run. Each job below is guarded by its
  # own input, and a workflow whose jobs all skip reports success - a green run
  # that tested nothing is worse than no run at all.
  guard:
    runs-on: ${{ vars.RUNNER_LABELS }}
    steps:
      - name: Check at least one template was selected
        env:
          SELECTED: >-
            ${{ inputs.test_ubuntu_22_04_server
             || inputs.test_ubuntu_22_04_desktop
             || inputs.test_ubuntu_24_04_server
             || inputs.test_ubuntu_24_04_desktop
             || inputs.test_ubuntu_24_04_server_hardened
             || inputs.test_netbox_appliance
             || inputs.test_windows_server_2019
             || inputs.test_windows_server_2022 }}
        run: |
          if [ "${SELECTED}" != 'true' ]; then
            echo "No templates selected. Tick at least one test_* input;"
            echo "a run that tests nothing would report success."
            exit 1
          fi
          echo "At least one template selected."

  ubuntu-22-04-server:
    needs: guard
    if: ${{ inputs.test_ubuntu_22_04_server }}
    uses: ./.github/workflows/test_ubuntu_22_04_server.yml
    secrets: inherit
    with:
      # fromJSON, because workflow_dispatch surfaces number inputs as strings
      # and a called workflow's number-typed input rejects a string outright -
      # the job then fails to instantiate at all. Run 31791530745 is the proof:
      # the two booleans in this block passed, the two numbers did not.
      keep_minutes: ${{ fromJSON(inputs.keep_minutes || '0') }}
      ip_timeout: ${{ inputs.ip_timeout }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  ubuntu-22-04-desktop:
    needs: guard
    if: ${{ inputs.test_ubuntu_22_04_desktop }}
    uses: ./.github/workflows/test_ubuntu_22_04_desktop.yml
    secrets: inherit
    with:
      keep_minutes: ${{ fromJSON(inputs.keep_minutes || '0') }}
      ip_timeout: ${{ inputs.ip_timeout }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  ubuntu-24-04-server:
    needs: guard
    if: ${{ inputs.test_ubuntu_24_04_server }}
    uses: ./.github/workflows/test_ubuntu_24_04_server.yml
    secrets: inherit
    with:
      keep_minutes: ${{ fromJSON(inputs.keep_minutes || '0') }}
      ip_timeout: ${{ inputs.ip_timeout }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  ubuntu-24-04-desktop:
    needs: guard
    if: ${{ inputs.test_ubuntu_24_04_desktop }}
    uses: ./.github/workflows/test_ubuntu_24_04_desktop.yml
    secrets: inherit
    with:
      keep_minutes: ${{ fromJSON(inputs.keep_minutes || '0') }}
      ip_timeout: ${{ inputs.ip_timeout }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  ubuntu-24-04-server-hardened:
    needs: guard
    if: ${{ inputs.test_ubuntu_24_04_server_hardened }}
    uses: ./.github/workflows/test_ubuntu_24_04_server_hardened.yml
    secrets: inherit
    with:
      keep_minutes: ${{ fromJSON(inputs.keep_minutes || '0') }}
      ip_timeout: ${{ inputs.ip_timeout }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  netbox-appliance:
    needs: guard
    if: ${{ inputs.test_netbox_appliance }}
    uses: ./.github/workflows/test_netbox_appliance.yml
    secrets: inherit
    with:
      keep_minutes: ${{ fromJSON(inputs.keep_minutes || '0') }}
      ip_timeout: ${{ inputs.ip_timeout }}
      netbox_http_check: ${{ inputs.netbox_http_check }}
      netbox_timeout_minutes: ${{ fromJSON(inputs.netbox_timeout_minutes || '20') }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  windows-server-2019:
    needs: guard
    if: ${{ inputs.test_windows_server_2019 }}
    uses: ./.github/workflows/test_windows_server_2019.yml
    secrets: inherit
    with:
      keep_minutes: ${{ fromJSON(inputs.keep_minutes || '0') }}
      ip_timeout: ${{ inputs.ip_timeout }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  windows-server-2022:
    needs: guard
    if: ${{ inputs.test_windows_server_2022 }}
    uses: ./.github/workflows/test_windows_server_2022.yml
    secrets: inherit
    with:
      keep_minutes: ${{ fromJSON(inputs.keep_minutes || '0') }}
      ip_timeout: ${{ inputs.ip_timeout }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}
