
name: Normalize Deploy Form

on:
  workflow_dispatch:
    inputs:
      template_name:
        description: Content library item (template) name to normalize
        type: string
        required: true
      extra_descriptors:
        description: Deploy-form extension the item was built with (application-layer images only)
        type: choice
        required: false
        default: none
        options:
          - none
          - netbox

permissions:
  contents: read
  packages: read

jobs:
  normalize:
    runs-on: ${{ vars.RUNNER_LABELS }}
    container: "${{ vars.PACKER_DOCKER_IMAGE }}:${{ vars.PACKER_DOCKER_IMAGE_TAG }}"
    steps:
      - uses: Anush008/clean-after-action@073a5f242d4ca633e252aa465cbb32ef792e4f7a # v4.2.0

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Reruns the post-build normalization on an existing library item, for
      # templates exported while the normalize step was broken or before it
      # existed - no rebuild needed.
      - name: Normalize deploy form in the library item
        env:
          VCENTER_SERVER: ${{ secrets.VCENTER_HOST }}
          VCENTER_USERNAME: ${{ secrets.VCENTER_USER }}
          VCENTER_PASSWORD: ${{ secrets.VCENTER_PASS }}
          VCENTER_INSECURE: ${{ secrets.VCENTER_INSECURE_CONNECTION }}
          LIBRARY_NAME: ${{ vars.VCENTER_PACKER_CONTENT_LIBRARY_NAME }}
          TEMPLATE_NAME: ${{ inputs.template_name }}
          # Application-layer images extend the deploy form; the normalizer has
          # to be given the same descriptor file the build used, or their extra
          # properties end up in an "Other" category.
          VAPP_EXTRA_DESCRIPTORS: ${{ inputs.extra_descriptors == 'none' && '' || format('shared/vapp-descriptors/{0}.json', inputs.extra_descriptors) }}
        run: |
          python3 shared/scripts/normalize-library-ovf.py
