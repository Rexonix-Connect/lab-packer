
name: Build Ubuntu 22.04 Desktop VM Template

on:
  workflow_dispatch:
    inputs:
      disk_size_gb:
        description: VM template disk size in GB (minimum 25)
        type: number
        required: false
        default: 60
      ssh_timeout:
        description: Packer SSH wait timeout (for example 45m or 1h)
        type: string
        required: false
        default: 45m

  # Callable from the Rebuild All VM Templates orchestrator.
  workflow_call:
    inputs:
      disk_size_gb:
        description: VM template disk size in GB (minimum 25)
        type: number
        required: false
        default: 60
      ssh_timeout:
        description: Packer SSH wait timeout (for example 45m or 1h)
        type: string
        required: false
        default: 45m

permissions:
  contents: read
  packages: read

jobs:
  packer:
    runs-on: ${{ vars.RUNNER_LABELS }}
    container: "${{ vars.PACKER_DOCKER_IMAGE }}:${{ vars.PACKER_DOCKER_IMAGE_TAG }}"
    env:
      PKR_VAR_vCenterServer: ${{ secrets.VCENTER_HOST }}
      PKR_VAR_vCenterUsername: ${{ secrets.VCENTER_USER }}
      PKR_VAR_vCenterPassword: ${{ secrets.VCENTER_PASS }}
      PKR_VAR_vCenterInsecureConnection: ${{ secrets.VCENTER_INSECURE_CONNECTION }}
      PKR_VAR_vCenterDatacenterName: ${{ vars.VCENTER_DATACENTER_NAME }}
      PKR_VAR_clusterName: ${{ vars.VCENTER_CLUSTER_NAME }}
      PKR_VAR_datastoreName: ${{ vars.VCENTER_DATASTORE_NAME }}
      PKR_VAR_diskSizeGb: ${{ inputs.disk_size_gb }}
      PKR_VAR_sshTimeout: ${{ inputs.ssh_timeout }}
      PKR_VAR_isoPath: ${{ vars.UBUNTU_22_04_SERVER_X64_ISO_PATH }}
      PKR_VAR_templateName: ${{ vars.UBUNTU_22_04_DESKTOP_X64_VM_TEMPLATE_NAME }}
      PKR_VAR_libraryName: ${{ vars.VCENTER_PACKER_CONTENT_LIBRARY_NAME }}
      PKR_VAR_portGroup: ${{ vars.VCENTER_DEFAULT_PORT_GROUP }}
      PKR_VAR_vmName: "ubuntu2204desktop-temp"
      PKR_VAR_installDesktop: "true"
      PKR_VAR_cpuCount: "4"
      PKR_VAR_memoryMb: "8192"
      PKR_VAR_vmFolder: "/"
      PKR_VAR_vmUsername: "vagrant"
      PKR_VAR_vmPassword: ${{ secrets.PACKER_VM_PASSWORD }}
      PACKER_LOG: 1
    steps:
      - uses: Anush008/clean-after-action@073a5f242d4ca633e252aa465cbb32ef792e4f7a # v4.2.0

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Generate password hash
        id: hash
        env:
          PACKER_VM_PASSWORD: ${{ secrets.PACKER_VM_PASSWORD }}
          RECOVERY_PASSWORD: ${{ secrets.RECOVERY_PASSWORD }}
        run: |
          echo "vm_password_hash=$(printf '%s' "$PACKER_VM_PASSWORD" | openssl passwd -6 -stdin)" >> $GITHUB_OUTPUT
          echo "recovery_password_hash=$(printf '%s' "$RECOVERY_PASSWORD" | openssl passwd -6 -stdin)" >> $GITHUB_OUTPUT

      - name: Packer init
        run: |
          packer init ./shared/config.pkr.hcl

      - name: Packer fmt
        run: |
          packer fmt -check ./shared/config.pkr.hcl
          packer fmt -check ./Ubuntu/22/04

      - name: Packer validate
        env:
          PKR_VAR_vmPasswordHash: ${{ steps.hash.outputs.vm_password_hash }}
          PKR_VAR_recoveryPasswordHash: ${{ steps.hash.outputs.recovery_password_hash }}
        run: |
          cd Ubuntu/22/04
          packer validate -only='vsphere-iso.base' .

      - name: Packer build
        env:
          PKR_VAR_vmPasswordHash: ${{ steps.hash.outputs.vm_password_hash }}
          PKR_VAR_recoveryPasswordHash: ${{ steps.hash.outputs.recovery_password_hash }}
        run: |
          cd Ubuntu/22/04
          packer build -timestamp-ui -force -only='vsphere-iso.base' .
