
name: Rebuild All VM Templates

on:
  workflow_dispatch:
    inputs:
      continue_on_failure:
        description: Keep rebuilding the remaining templates when one build fails
        type: boolean
        required: false
        default: false
      run_tests:
        description: Run the Test VM Templates flow after the rebuilds
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: read

# Rebuilds all templates in sequence by calling the individual build
# workflows; on a single self-hosted runner expect several hours end to end.
# The NetBox appliance is cloned from the hardened template rather than built
# from an ISO, so it runs directly after it. With continue_on_failure it will
# still run after a failed hardened build - it then clones the previous
# hardened library item, which is deliberate: an appliance built on the last
# known-good base beats no appliance at all.
jobs:
  ubuntu-22-04-server:
    uses: ./.github/workflows/build_ubuntu_22_04_server_vm_template.yml
    secrets: inherit

  ubuntu-22-04-desktop:
    needs: ubuntu-22-04-server
    if: ${{ !cancelled() && (inputs.continue_on_failure || needs.ubuntu-22-04-server.result == 'success') }}
    uses: ./.github/workflows/build_ubuntu_22_04_desktop_vm_template.yml
    secrets: inherit

  ubuntu-24-04-server:
    needs: ubuntu-22-04-desktop
    if: ${{ !cancelled() && (inputs.continue_on_failure || needs.ubuntu-22-04-desktop.result == 'success') }}
    uses: ./.github/workflows/build_ubuntu_24_04_server_vm_template.yml
    secrets: inherit

  ubuntu-24-04-desktop:
    needs: ubuntu-24-04-server
    if: ${{ !cancelled() && (inputs.continue_on_failure || needs.ubuntu-24-04-server.result == 'success') }}
    uses: ./.github/workflows/build_ubuntu_24_04_desktop_vm_template.yml
    secrets: inherit

  ubuntu-24-04-server-hardened:
    needs: ubuntu-24-04-desktop
    if: ${{ !cancelled() && (inputs.continue_on_failure || needs.ubuntu-24-04-desktop.result == 'success') }}
    uses: ./.github/workflows/build_ubuntu_24_04_server_hardened_vm_template.yml
    secrets: inherit

  # Clones the hardened library item, so it has to follow that build.
  netbox-appliance:
    needs: ubuntu-24-04-server-hardened
    if: ${{ !cancelled() && (inputs.continue_on_failure || needs.ubuntu-24-04-server-hardened.result == 'success') }}
    uses: ./.github/workflows/build_netbox_appliance_vm_template.yml
    secrets: inherit

  windows-2019:
    needs: netbox-appliance
    if: ${{ !cancelled() && (inputs.continue_on_failure || needs.netbox-appliance.result == 'success') }}
    uses: ./.github/workflows/build_windows_server_2019_vm_template.yml
    secrets: inherit

  windows-2022:
    needs: windows-2019
    if: ${{ !cancelled() && (inputs.continue_on_failure || needs.windows-2019.result == 'success') }}
    uses: ./.github/workflows/build_windows_server_2022_vm_template.yml
    secrets: inherit

  test:
    needs: windows-2022
    if: ${{ !cancelled() && inputs.run_tests && (inputs.continue_on_failure || needs.windows-2022.result == 'success') }}
    uses: ./.github/workflows/test_vm_templates.yml
    secrets: inherit
