name: Rebuild All VM Templates

on:
  workflow_dispatch:
    inputs:
      rebuild_ubuntu_22_04_server:
        description: Rebuild the Ubuntu 22.04 server template
        type: boolean
        required: false
        default: true
      rebuild_ubuntu_22_04_desktop:
        description: Rebuild the Ubuntu 22.04 desktop template
        type: boolean
        required: false
        default: true
      rebuild_ubuntu_24_04_server:
        description: Rebuild the Ubuntu 24.04 server template
        type: boolean
        required: false
        default: true
      rebuild_ubuntu_24_04_desktop:
        description: Rebuild the Ubuntu 24.04 desktop template
        type: boolean
        required: false
        default: true
      rebuild_ubuntu_24_04_server_hardened:
        description: Rebuild the Ubuntu 24.04 server hardened template
        type: boolean
        required: false
        default: true
      rebuild_netbox_appliance:
        description: Rebuild the NetBox appliance template
        type: boolean
        required: false
        default: true
      rebuild_windows_server_2019:
        description: Rebuild the Windows Server 2019 template
        type: boolean
        required: false
        default: true
      rebuild_windows_server_2022:
        description: Rebuild the Windows Server 2022 template
        type: boolean
        required: false
        default: true
      continue_on_failure:
        description: Keep rebuilding the remaining templates when one build fails
        type: boolean
        required: false
        default: false
      run_tests:
        description: Test each template as soon as it is built
        type: boolean
        required: false
        default: true

      keep_minutes:
        description: Minutes to keep each successful test VM running before deletion (0 deletes immediately)
        type: number
        required: false
        default: 0
      netbox_timeout_minutes:
        description: Minutes to wait for the NetBox appliance to finish its first-boot bootstrap
        type: number
        required: false
        default: 20
      collect_diagnostics:
        description: Seed a login on Linux guests, check they booted cleanly, and dump state on failure
        type: boolean
        required: false
        default: true
      destroy_on_failure:
        description: Delete a test VM even when its test fails (failures otherwise keep it for inspection)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: read

# Rebuilds the selected templates in sequence by calling the individual build
# workflows; on a single self-hosted runner expect several hours end to end.
#
# Each build is followed immediately by that template's own test, which runs
# alongside the next build rather than waiting for the whole queue. A broken
# image is therefore reported within minutes of being built instead of hours
# later, and a run that dies halfway still leaves the templates it did finish
# tested. The builds stay serialized - only their tests overlap - so the load
# on vCenter is unchanged.
#
# The chain is `needs:` on the previous BUILD, guarded by `!= 'failure'` rather
# than `== 'success'`, so unticking a template skips it without stopping
# everything behind it.
#
# GitHub documents a ten-input maximum for workflow_dispatch, but it is not
# enforced: test_vm_templates.yml has carried fourteen and dispatched fine.
# This file stays at fourteen rather than going further, because fourteen is
# what is actually proven to work here. ip_timeout and netbox_http_check are
# the two left out; run a template's own test workflow to set those.
#
# The NetBox appliance is cloned from the hardened template rather than built
# from an ISO, so it runs directly after it. With continue_on_failure it will
# still run after a failed hardened build - it then clones the previous
# hardened library item, which is deliberate: an appliance built on the last
# known-good base beats no appliance at all.
jobs:
  ubuntu-22-04-server:
    if: ${{ inputs.rebuild_ubuntu_22_04_server }}
    uses: ./.github/workflows/build_ubuntu_22_04_server_vm_template.yml
    secrets: inherit

  test-ubuntu-22-04-server:
    needs: ubuntu-22-04-server
    if: ${{ !cancelled() && inputs.run_tests && needs.ubuntu-22-04-server.result == 'success' }}
    uses: ./.github/workflows/test_ubuntu_22_04_server.yml
    secrets: inherit
    with:
      keep_minutes: ${{ inputs.keep_minutes }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  ubuntu-22-04-desktop:
    needs: ubuntu-22-04-server
    if: ${{ !cancelled() && inputs.rebuild_ubuntu_22_04_desktop && (inputs.continue_on_failure || needs.ubuntu-22-04-server.result != 'failure') }}
    uses: ./.github/workflows/build_ubuntu_22_04_desktop_vm_template.yml
    secrets: inherit

  test-ubuntu-22-04-desktop:
    needs: ubuntu-22-04-desktop
    if: ${{ !cancelled() && inputs.run_tests && needs.ubuntu-22-04-desktop.result == 'success' }}
    uses: ./.github/workflows/test_ubuntu_22_04_desktop.yml
    secrets: inherit
    with:
      keep_minutes: ${{ inputs.keep_minutes }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  ubuntu-24-04-server:
    needs: ubuntu-22-04-desktop
    if: ${{ !cancelled() && inputs.rebuild_ubuntu_24_04_server && (inputs.continue_on_failure || needs.ubuntu-22-04-desktop.result != 'failure') }}
    uses: ./.github/workflows/build_ubuntu_24_04_server_vm_template.yml
    secrets: inherit

  test-ubuntu-24-04-server:
    needs: ubuntu-24-04-server
    if: ${{ !cancelled() && inputs.run_tests && needs.ubuntu-24-04-server.result == 'success' }}
    uses: ./.github/workflows/test_ubuntu_24_04_server.yml
    secrets: inherit
    with:
      keep_minutes: ${{ inputs.keep_minutes }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  ubuntu-24-04-desktop:
    needs: ubuntu-24-04-server
    if: ${{ !cancelled() && inputs.rebuild_ubuntu_24_04_desktop && (inputs.continue_on_failure || needs.ubuntu-24-04-server.result != 'failure') }}
    uses: ./.github/workflows/build_ubuntu_24_04_desktop_vm_template.yml
    secrets: inherit

  test-ubuntu-24-04-desktop:
    needs: ubuntu-24-04-desktop
    if: ${{ !cancelled() && inputs.run_tests && needs.ubuntu-24-04-desktop.result == 'success' }}
    uses: ./.github/workflows/test_ubuntu_24_04_desktop.yml
    secrets: inherit
    with:
      keep_minutes: ${{ inputs.keep_minutes }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  ubuntu-24-04-server-hardened:
    needs: ubuntu-24-04-desktop
    if: ${{ !cancelled() && inputs.rebuild_ubuntu_24_04_server_hardened && (inputs.continue_on_failure || needs.ubuntu-24-04-desktop.result != 'failure') }}
    uses: ./.github/workflows/build_ubuntu_24_04_server_hardened_vm_template.yml
    secrets: inherit

  test-ubuntu-24-04-server-hardened:
    needs: ubuntu-24-04-server-hardened
    if: ${{ !cancelled() && inputs.run_tests && needs.ubuntu-24-04-server-hardened.result == 'success' }}
    uses: ./.github/workflows/test_ubuntu_24_04_server_hardened.yml
    secrets: inherit
    with:
      keep_minutes: ${{ inputs.keep_minutes }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  # Clones the hardened library item, so it has to follow that build.
  netbox-appliance:
    needs: ubuntu-24-04-server-hardened
    if: ${{ !cancelled() && inputs.rebuild_netbox_appliance && (inputs.continue_on_failure || needs.ubuntu-24-04-server-hardened.result != 'failure') }}
    uses: ./.github/workflows/build_netbox_appliance_vm_template.yml
    secrets: inherit

  test-netbox-appliance:
    needs: netbox-appliance
    if: ${{ !cancelled() && inputs.run_tests && needs.netbox-appliance.result == 'success' }}
    uses: ./.github/workflows/test_netbox_appliance.yml
    secrets: inherit
    with:
      keep_minutes: ${{ inputs.keep_minutes }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}
      netbox_timeout_minutes: ${{ inputs.netbox_timeout_minutes }}

  windows-server-2019:
    needs: netbox-appliance
    if: ${{ !cancelled() && inputs.rebuild_windows_server_2019 && (inputs.continue_on_failure || needs.netbox-appliance.result != 'failure') }}
    uses: ./.github/workflows/build_windows_server_2019_vm_template.yml
    secrets: inherit

  test-windows-server-2019:
    needs: windows-server-2019
    if: ${{ !cancelled() && inputs.run_tests && needs.windows-server-2019.result == 'success' }}
    uses: ./.github/workflows/test_windows_server_2019.yml
    secrets: inherit
    with:
      keep_minutes: ${{ inputs.keep_minutes }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}

  windows-server-2022:
    needs: windows-server-2019
    if: ${{ !cancelled() && inputs.rebuild_windows_server_2022 && (inputs.continue_on_failure || needs.windows-server-2019.result != 'failure') }}
    uses: ./.github/workflows/build_windows_server_2022_vm_template.yml
    secrets: inherit

  test-windows-server-2022:
    needs: windows-server-2022
    if: ${{ !cancelled() && inputs.run_tests && needs.windows-server-2022.result == 'success' }}
    uses: ./.github/workflows/test_windows_server_2022.yml
    secrets: inherit
    with:
      keep_minutes: ${{ inputs.keep_minutes }}
      collect_diagnostics: ${{ inputs.collect_diagnostics }}
      destroy_on_failure: ${{ inputs.destroy_on_failure }}
