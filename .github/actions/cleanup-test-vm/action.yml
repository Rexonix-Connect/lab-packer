name: Clean up a test VM
description: >
  Hold the VM for inspection if asked, then delete it. A failed run keeps its VM
  so it can be examined - deleting the only evidence is how three rounds of this
  appliance's diagnosis were wasted - unless destroy_on_failure says otherwise.

inputs:
  vm_name:
    description: Name of the deployed VM
    required: true
  guest_ip:
    description: Address of the guest, for the message
    required: false
    default: ''
  keep_minutes:
    description: Minutes to hold the VM before deleting it
    required: false
    default: '0'
  destroy_on_failure:
    description: Delete the VM even when the job failed (true/false)
    required: false
    default: 'false'
  diag_user:
    description: Account the key authorizes, for the message
    required: false
    default: diag
  diag_key:
    description: Private key, removed only once the VM it authorizes is gone
    required: true
  job_status:
    description: The calling job's status so far, from job.status
    required: true

runs:
  using: composite
  steps:
    - name: Keep the VM for inspection
      if: ${{ inputs.keep_minutes != '0' }}
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
        KEEP_MINUTES: ${{ inputs.keep_minutes }}
      run: |
        echo "Keeping '${VM_NAME}' running for ${KEEP_MINUTES} minutes ..."
        sleep $(( KEEP_MINUTES * 60 ))

    - name: Report the VM kept for inspection
      if: ${{ inputs.job_status == 'failure' && inputs.destroy_on_failure != 'true' }}
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
        GUEST_IP: ${{ inputs.guest_ip }}
        DIAG_USER: ${{ inputs.diag_user }}
        DIAG_KEY: ${{ inputs.diag_key }}
      run: |
        echo "::warning::'${VM_NAME}' (${GUEST_IP:-no IP}) was left running for inspection. Delete it with: govc vm.destroy ${VM_NAME}"
        # The seeded account has a locked password and the templates ship with
        # their provisioning account removed or disabled, so this key is the
        # only way onto the VM that was deliberately kept. Deleting it here
        # would leave the evidence intact and unreachable.
        if [ -f "${DIAG_KEY}" ]; then
          echo "Kept the login for it on this runner:"
          echo "  ssh -i ${DIAG_KEY} ${DIAG_USER}@${GUEST_IP:-<ip>}"
          echo "  rm -f ${DIAG_KEY} ${DIAG_KEY}.pub   # once the VM is gone"
        fi

    - name: Delete the test VM
      if: ${{ inputs.job_status != 'failure' || inputs.destroy_on_failure == 'true' }}
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
      run: |
        # No pipeline into `grep -q`. A composite action's `shell: bash` is
        # `bash --noprofile --norc -e -o pipefail`, and grep -q exits on its
        # first match, so govc dies of SIGPIPE and pipefail reports the whole
        # pipeline as failed - precisely when the VM DOES exist. This step then
        # took the "nothing to delete" branch and leaked every test VM it was
        # supposed to remove. The same construct read correctly in the workflow
        # this was lifted from, because there the default shell is `bash -e`,
        # without pipefail.
        info="$(govc vm.info "${VM_NAME}" 2>/dev/null || true)"
        if grep -q "${VM_NAME}" <<<"${info}"; then
          govc vm.destroy "${VM_NAME}"
          echo "Deleted '${VM_NAME}'."
        else
          echo "'${VM_NAME}' was not deployed; nothing to delete."
        fi

    # Only once the VM it authorizes is gone. A key kept beside a retained VM is
    # the access path to it; a key kept after the VM is destroyed is litter.
    - name: Remove the diagnostics key
      if: ${{ inputs.job_status != 'failure' || inputs.destroy_on_failure == 'true' }}
      shell: bash
      env:
        DIAG_KEY: ${{ inputs.diag_key }}
      run: |
        rm -f "${DIAG_KEY}" "${DIAG_KEY}.pub"
